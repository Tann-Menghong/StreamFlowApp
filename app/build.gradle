plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.streamflow'
    compileSdk 35

    defaultConfig {
        applicationId "com.streamflow"
        minSdk 21
        targetSdk 34
        versionCode 172
        versionName "6.23.0"
        vectorDrawables {
            useSupportLibrary true
        }

        // Ship only the CPU architectures real phones use.
        //
        // MediaPipe's LLM engine contributes a ~53 MB native library, and with no
        // filter the APK carried FOUR copies of it — one per ABI — even though a
        // given phone can only ever load one:
        //
        //   x86          17.2 MB   emulator only, 32-bit, obsolete
        //   x86_64       15.0 MB   emulator only
        //   arm64-v8a    12.8 MB   every modern phone
        //   armeabi-v7a   8.3 MB   older 32-bit ARM phones
        //
        // Dropping the two x86 variants removes ~32 MB of dead weight from every
        // download without affecting a single real device. This matters more than
        // usual here because the app self-updates by downloading its own APK from
        // GitHub, so the saving is paid back on every single update.
        //
        // To test on an emulator, temporarily add 'x86_64' to this list.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        buildConfigField "String", "GITHUB_RELEASES_URL", '"https://github.com/Tann-Menghong/StreamFlowApp/releases"'
    }

    // Release signing credentials are read from OUTSIDE this repository.
    //
    // They used to be literal strings right here, in a tracked file, in a public
    // repo. The keystore itself was always gitignored -- so the key was never
    // actually leaked -- but publishing the passphrase left that one file as the
    // only thing between the repository and a forged update. That matters more
    // than usual for this app: it holds REQUEST_INSTALL_PACKAGES and installs
    // APKs it downloads from GitHub itself.
    //
    // The key is deliberately NOT rotated. Android requires an update to carry
    // the same signing certificate as the installed app, so a new key would
    // leave every existing install unable to update -- a one-way door. The
    // correct posture is to guard the .jks absolutely and treat the old
    // passphrase (still in git history) as spent.
    //
    // Put these in ~/.gradle/gradle.properties -- the user-level file, never one
    // inside the project:
    //     streamflowStorePassword=...
    //     streamflowKeyPassword=...
    // or export STREAMFLOW_STORE_PASSWORD / STREAMFLOW_KEY_PASSWORD.
    def releaseStorePw = project.findProperty('streamflowStorePassword')
        ?: System.getenv('STREAMFLOW_STORE_PASSWORD')
    def releaseKeyPw = project.findProperty('streamflowKeyPassword')
        ?: System.getenv('STREAMFLOW_KEY_PASSWORD')
    def releaseKeystore = file('streamflow-release.jks')
    def canSignRelease = releaseStorePw != null && releaseKeyPw != null && releaseKeystore.exists()

    signingConfigs {
        release {
            if (canSignRelease) {
                storeFile     releaseKeystore
                storePassword releaseStorePw
                keyAlias      'streamflow'
                keyPassword   releaseKeyPw
            }
        }
    }

    buildTypes {
        release {
            // Falls back to debug signing when no credentials are configured, so
            // a clean clone -- and CI -- can still build and verify the release
            // variant (the only one that runs R8) instead of failing on a
            // missing keystore. A debug-signed APK cannot update a real install,
            // which is exactly the right failure mode.
            signingConfig   canSignRelease ? signingConfigs.release : signingConfigs.debug
            minifyEnabled   true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        // NewPipeExtractor's public API is built on java.time (DateWrapper takes and
        // returns OffsetDateTime/Instant — it has no Calendar path at all), and
        // java.time only exists natively from API 26. Without desugaring, every
        // extractor call that touches a date throws NoSuchMethodError on Android
        // 5-7 — an Error, so the repository's catch(Exception) blocks let it through
        // and the app died. Desugaring backports java.time all the way to minSdk 21.
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
        freeCompilerArgs += ['-opt-in=androidx.media3.common.util.UnstableApi']
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.10'
    }
    lint {
        // The module opts into media3's UnstableApi for the whole compilation via
        // freeCompilerArgs below, but lint doesn't read that flag and reported ~89
        // false errors — enough noise to make `lintRelease` useless as a gate and
        // hide the real API-level bugs underneath. Disabled so lint stays honest.
        disable 'UnsafeOptInUsageError'
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += '/META-INF/DEPENDENCIES'
        }
    }
}

dependencies {
    // Backports java.time (and other JDK 8+ APIs) to API 21 — see compileOptions.
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    def composeBom = platform('androidx.compose:compose-bom:2024.02.00')
    implementation composeBom

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    implementation 'androidx.core:core-ktx:1.12.0'
    // Branded launch: shows the gradient play logo while the app starts (all API levels)
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.navigation:navigation-compose:2.7.7'

    // ExoPlayer / Media3 - 1.8.1 is the CEILING, and the reason is DEVICE
    // SUPPORT, not laziness. Checked empirically, not assumed:
    //   1.9.0+   require minSdk 23 -- would drop every Android 5.0/5.1 device
    //   1.10.0+  require compileSdk 36 (this project is 35, AGP 8.6.1)
    // Raising minSdk is a product decision about who loses the app, so it is
    // not something to slip into a dependency bump. If it is ever taken, the
    // manifest merger is what enforces it and will say so plainly.
    implementation 'androidx.media3:media3-exoplayer:1.8.1'
    implementation 'androidx.media3:media3-ui:1.8.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.8.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.8.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.8.1'
    implementation 'androidx.media3:media3-session:1.8.1'

    // NewPipe Extractor — pinned to a stable release for reproducible builds.
    // v0.26.3 includes the SABR-enforcement workaround + playlist/date extraction fixes
    // that keep YouTube playback working. Bump this deliberately when a newer tag ships.
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.3'

    // WebView extensions — addDocumentStartJavaScript injects the ad-blocking
    // script into EVERY frame (including cross-origin player iframes) before any
    // page script runs. evaluateJavascript only ever reached the main frame,
    // which is why ads inside the player iframe survived every other defence.
    implementation 'androidx.webkit:webkit:1.11.0'

    // Image loading
    implementation 'io.coil-kt:coil-compose:2.6.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // HTTP client
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Room
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"

    // DataStore
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    // WorkManager — background new-video checks for subscriptions
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // MediaPipe LLM Inference — on-device AI (video summaries / Q&A).
    // Library minSdk is 24; the app stays minSdk 21 via tools:overrideLibrary
    // and every AI entry point is gated on AiEngine.isSupported().
    implementation 'com.google.mediapipe:tasks-genai:0.10.27'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // Plain JVM unit tests (./gradlew testReleaseUnitTest). Kept to logic that
    // has no Android dependency so the suite runs in seconds with no device and
    // no Robolectric — that constraint is why CustomTabs parses URLs with string
    // operations instead of android.net.Uri.
    testImplementation 'junit:junit:4.13.2'
}
